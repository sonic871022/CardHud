; CarHUD for M5Stack Cardputer Adv (K132-Adv) + Cap LoRa-1262 (GNSS)
[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified
    https://github.com/m5stack/M5Cardputer.git
    https://github.com/kosme/arduinoFFT.git#v1.6.2
